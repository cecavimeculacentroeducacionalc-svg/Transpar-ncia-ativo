@media (min-width:640px) and (max-width:1024px){#main{padding:20px!important}.chat-grid{grid-template-columns:minmax(0,1fr) 240px}}

.forum-topic-list{display:grid;gap:0;background:#fff;border:1px solid #DDE3EE;border-radius:.75rem;overflow:hidden}.forum-topic{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;padding:16px;border-top:1px solid #DDE3EE;cursor:pointer;min-width:0}.forum-topic:first-child{border-top:0}.forum-topic:hover{background:#F8FAFC}.forum-topic-main,.forum-topic-author{min-width:0;overflow-wrap:anywhere}.forum-topic-author{color:#64748B;font-size:.9rem}@media(max-width:639px){.forum-topic{display:block;padding:16px}.forum-topic-author{margin-top:8px;padding-top:8px;border-top:1px solid #EEF2F7}.forum-topic-title{font-size:1rem}.forum-topic-count{font-size:.9rem}}

@keyframes pb{to{background-position:-80px 0}}

</style></head>
<body>
<!-- Ecrã de abertura: o nome do sistema aparece SÓ aqui -->
<div id="splash">
  <div id="sp-t" aria-label="SIGILO Sistem G.E"></div>
  <button id="sp-m" class="btn2 text-sm" type="button">Som: ligado</button>
  <p class="text-sm text-slate-500">Toque no ecrã para ouvir o som de abertura</p>
</div>
<div id="app" class="hidden"></div>
<div id="toast" hidden></div>

<script>
/* ===== CONFIGURAÇÃO: cole aqui o URL da implementação do Apps Script ===== */
const API='https://script.google.com/macros/s/AKfycbzM6IKpMIb_5nvT8kyEYeIfs9IKgPfSH8SgDEyspR2PYgcIYlBQQNNiIdp0dSPIFCE3vw/exec';

/* ===== Utilitários ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(sessionStorage.sg||'null'),CFG={},ESC={nome:'Escola'},ACTS=[],VISTA=null;
const PL={director:'Director',pedagogico:'Pedagógico',secretaria:'Secretaria',professor_presencial:'Professor Presencial',professor_ead:'Professor EAD / Tutor',aluno_presencial:'Aluno Presencial',aluno_ead:'Aluno EAD'};
const DIA=['','Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
let P=[[1,'1.º Trimestre'],[2,'2.º Trimestre'],[3,'3.º Trimestre']];   // reserva; carregarPeriodos() substitui pela lista real da base
let CFGP=Promise.resolve();   // promessa da configuração (para as vistas que dela dependem)
const load='<p class="text-slate-500">A carregar…</p>';
const bd=v=>v?`<span class="px-2 py-0.5 rounded-full text-xs bg-blue-50 text-blue-900">${esc(v)}</span>`:'';
const opts=a=>a.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('');
const btn=(l,fn,c='btn')=>`<button type="button" class="${c}" onclick="ACTS[${ACTS.push(fn)-1}]()">${l}</button>`;
/* Sem texto "A carregar…": main(load) mantém o ecrã actual (bloqueia cliques) e o novo conteúdo entra quando os dados chegam.
   Só se a espera passar de 0,5 s aparece uma linha fina por baixo do cabeçalho (sem texto). */
let T_BARRA=null,T_SEG=null;
function livre(){clearTimeout(T_BARRA);clearTimeout(T_SEG);const m=$('#main'),b=$('#pbar');if(m)m.style.pointerEvents='';if(b)b.style.display='none'}
function main(h){
  const m=$('#main');if(!m)return;
  if(h===load){
    clearTimeout(T_BARRA);clearTimeout(T_SEG);
    m.style.pointerEvents='none';
    T_BARRA=setTimeout(()=>{let b=$('#pbar');if(!b){b=document.createElement('div');b.id='pbar';b.setAttribute('aria-hidden','true');document.body.appendChild(b)}b.style.display='block'},500);
    T_SEG=setTimeout(livre,12000);   // segurança: nunca deixa o ecrã bloqueado
    return;
  }
  livre();m.innerHTML=h;
}
const titulo=t=>`<h1 class="text-xl font-bold mb-3" style="color:var(--nv)">${t}</h1>`;
const rec=()=>VISTA&&VISTA();
const toast=(m,e)=>{livre();const t=$('#toast');t.textContent=m;t.className=`fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg text-white text-sm ${e?'bg-red-600':'bg-slate-800'}`;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};

/* ===== Cache por utilizador (só em memória; nada vai para o armazenamento do telemóvel) =====
   - Cada utilizador (username|perfil) tem o seu próprio "balde". Nunca se lê o balde de outro.
   - Quando ENTRA um utilizador, os baldes de todos os outros são apagados (purgarOutros).
   - Se o MESMO utilizador sair e voltar a entrar, o balde dele continua e tudo abre depressa.
   - Dados em cache aparecem logo; se têm mais de 30 s são renovados em silêncio. */
const CACHE={};
const LER=new Set(['obterConfig','obterEscola','listarPeriodos','listarTurmas','listarDisciplinas','listarTD','listarHorarios','listarCalendario','listarComunicados','minhasNotificacoes','painelAlunoEad','detalheDisciplinaEad','listarMateriais','listarAvaliacoes','listarForuns','listarChats','listarUtilizadores','listarAlunos','listarAnosLetivos','listarPautas','listarCorreccoes','listarTransferencias','listarDesistencias','listarDocumentos','listarConfigPagamento','pautaAluno','historicoAluno','meuPerfil','obterAluno']);
/* só estes redesenham o ecrã sozinhos quando os dados mudam no servidor */
const REDES=new Set(['painelAlunoEad','detalheDisciplinaEad','listarComunicados','listarCalendario','listarHorarios','listarAlunos','listarUtilizadores','listarTurmas','listarDisciplinas','listarPautas','listarCorreccoes','listarTransferencias','listarDesistencias','listarDocumentos','listarMateriais','pautaAluno','historicoAluno','listarConfigPagamento']);
/* acções que não alteram dados de ecrã: não limpam a cache */
const NEUTRAS=new Set(['login','logout','escolaPublica','pedirRecuperacao','confirmarRecuperacao','registarAcessoDisciplina','registarParticipacao','registarExportacao','marcarNotificacoesLidas']);
const SO_LEITURA=/^(listar|consultar|mensagens|detalhe|obter|minhas|painel|historico|meuPerfil|pauta|utilizadoresActivos|iaConsultar|relatorioGeral)/;
const FRESCO=3e4,MAXIDADE=18e5,MAXENT=80;
const quem=()=>S&&S.username?S.username+'|'+S.perfil:null;
const balde=u=>u?(CACHE[u]=CACHE[u]||{ver:0,d:{},f:{}}):null;
const purgarOutros=()=>{const u=quem();for(const k in CACHE)if(k!==u)delete CACHE[k]};
const ocupado=()=>document.hidden||!!document.querySelector('.modal-shell')||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
const clonar=j=>JSON.parse(JSON.stringify(j));
function guardar(b,key,j){
  if(j.trocar_senha)return;
  b.d[key]={t:Date.now(),r:JSON.stringify(j),a:0};
  const ks=Object.keys(b.d);if(ks.length>MAXENT)delete b.d[ks[0]];
}
function redesenhar(){const y=window.scrollY;rec();setTimeout(()=>window.scrollTo(0,y),80)}

async function api(accao,d={},tok=true){
  const u=quem(),le=LER.has(accao),b=le?balde(u):null,key=accao+'|'+JSON.stringify(d);
  if(b){
    const e=b.d[key];
    if(e&&Date.now()-e.t<MAXIDADE){
      if(Date.now()-e.t>FRESCO&&!e.a){e.a=1;renovar(u,b,key,accao,d,tok)}   // desactualizado: renova em silêncio
      return JSON.parse(e.r);
    }
    if(b.f[key])return b.f[key].then(clonar);                                // mesmo pedido já em curso
    const v=b.ver,p=pedidoReal(accao,d,tok);b.f[key]=p;
    const j=await p;if(b.f[key]===p)delete b.f[key];
    if(!j.erro&&quem()===u&&CACHE[u]===b&&b.ver===v)guardar(b,key,j);
    return clonar(j);
  }
  const escreve=!le&&!NEUTRAS.has(accao)&&!SO_LEITURA.test(accao),x=escreve?balde(u):null;
  if(x){x.ver++;x.d={};x.f={}}                                               // escrita: limpa a cache DESTE utilizador
  const j=await pedidoReal(accao,d,tok);
  if(x){const y=CACHE[u];if(y){y.ver++;y.d={};y.f={}}}
  if(accao==='marcarNotificacoesLidas'){const y=CACHE[u];if(y)for(const k in y.d)if(k.indexOf('minhasNotificacoes|')===0)delete y.d[k]}
  return j;
}
function renovar(u,b,key,accao,d,tok){
  const v=b.ver,vista=VISTA;
  pedidoReal(accao,d,tok).then(j=>{
    const e=b.d[key];if(e)e.a=0;
    if(j.erro||quem()!==u||CACHE[u]!==b||b.ver!==v)return;                  // utilizador mudou ou houve escrita: descarta
    const mudou=!e||e.r!==JSON.stringify(j);
    guardar(b,key,j);
    if(mudou&&REDES.has(accao)&&vista===VISTA&&!ocupado())redesenhar();     // só redesenha se mudou e o utilizador não está a escrever
  });
}
/* pedido real ao servidor (POST sem Content-Type, evita preflight/CORS) */
async function pedidoReal(accao,d,tok){
  const payload={accao,token:tok&&S?S.token:undefined,...d};
  for(let tentativa=0;tentativa<2;tentativa++){
    try{const r=await fetch(API,{method:'POST',body:JSON.stringify(payload)}),j=await r.json();
      if(j.erro&&/Sessão inválida/.test(j.erro)){sair(true);return j} if(j.trocar_senha)trocaObrig();
      if(j.erro&&/Service invoked too many times|Muitos utilizadores/i.test(j.erro)&&tentativa===0){await new Promise(x=>setTimeout(x,3000));continue} return j;
    }catch(e){if(tentativa===0){await new Promise(x=>setTimeout(x,3000));continue}return{erro:'Sem ligação ao servidor'}}
  } return{erro:'Sem ligação ao servidor'}
}
const go=async(a,d,m='Concluído')=>{const r=await api(a,d);r.erro?toast(r.erro,1):(toast(m),rec());return r};

/* ===== Modal e formulários ===== */
function modal(t,b,ok,lbl='Guardar',fechar=true){
  const m=document.createElement('div');
  m.className='fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3';m.style.background='rgba(11,42,91,.45)';
  m.innerHTML=`<div class="modal-shell bg-white rounded-xl w-full max-w-lg max-h-[90vh] overflow-auto p-5 space-y-3"><h2 class="font-bold text-lg" style="color:var(--nv)">${t}</h2><div class="mb space-y-3">${b}</div><p class="me text-red-600 text-sm"></p><div class="modal-actions flex gap-2 justify-end">${fechar?'<button type="button" class="btn2 mc">Fechar</button>':''}${ok?`<button type="button" class="btn mo">${lbl}</button>`:''}</div></div>`;
  document.body.appendChild(m);
  const c=m.querySelector('.mc');if(c)c.onclick=()=>m.remove();
  const o=m.querySelector('.mo');
  if(o)o.onclick=async()=>{o.disabled=true;const r=await ok(m.querySelector('.mb'),s=>m.querySelector('.me').textContent=s);o.disabled=false;if(r)m.remove()};
  return m;
}
const info=(t,h)=>modal(t,h,null);
const campo=([n,l,t='text',o,v=''])=>`<div><label class="lb">${l}</label>`+(t==='select'?`<select class="inp" name="${n}"><option value="">—</option>${o.map(x=>`<option value="${x[0]}" ${x[0]==v&&v!==''?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:t==='textarea'?`<textarea class="inp" name="${n}" rows="3">${esc(v)}</textarea>`:t==='checkbox'?`<input type="checkbox" name="${n}" ${v?'checked':''}>`:`<input class="inp" type="${t}" name="${n}" value="${esc(v)}" ${t==='password'?'autocomplete="new-password"':''}>`)+'</div>';
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r({nome:f.name,mime:f.type,base64:x.result.split(',')[1]});x.readAsDataURL(f)});
async function ler(b){
  const d={};
  for(const e of b.querySelectorAll('[name]')){
    let v=e.type==='checkbox'?e.checked:e.type==='file'?(e.files[0]?await b64(e.files[0]):null):e.value;
    if(e.type==='number'||/_id$|^dia_semana$/.test(e.name))v=(v===''||v===null)?null:Number(v);
    d[e.name]=v;
  }
  return d;
}
function form(t,campos,accao,extra={},depois,lbl){
  modal(t,campos.map(campo).join(''),async(b,er)=>{
    const r=await api(accao,{...extra,...await ler(b)});
    if(r.erro){er(r.erro);return false}
    depois?depois(r):(toast('Guardado'),rec());return true;
  },lbl);

async function avalCorpo(o){
  const al=S.perfil==='aluno_ead',tut=S.perfil==='professor_ead';
  if(tut)await carregarPeriodos();
  const r=await api('listarAvaliacoes',{turma_disciplina_id:o.id});
  if(r.erro)return pc(erroP(r));
  const L=r.dados||[];
  const sub=a=>{const s=a.minha_submissao;return s?`<p class="text-sm mt-1">${bd(s.estado)} ${s.nota!=null?`Nota: <b>${esc(s.nota)}</b>`:''} ${s.feedback?`<span class="text-slate-600">· ${esc(s.feedback)}</span>`:''}</p>`:'<p class="text-sm text-slate-500 mt-1">Ainda não submeteu.</p>'};
  pc((tut?`<div class="mb-3">${btn('Nova avaliação',()=>form('Nova avaliação',[['codigo','Tipo','select',[['T1','Teste 1'],['T2','Teste 2'],['T3','Teste 3'],['TI','Trabalho individual'],['TG','Trabalho de grupo']]],['periodo_id','Período','select',P],['titulo','Título'],['descricao','Descrição','textarea'],['data_abertura','Abre em','datetime-local'],['prazo','Prazo de entrega','datetime-local']],'criarAvaliacao',{turma_disciplina_id:o.id},()=>{toast('Avaliação criada');avalCorpo(o)}))}</div>`:'')+
  (L.map(a=>`<section class="bg-white border rounded-xl p-4 mb-2"><div class="flex flex-wrap justify-between gap-2"><b>${esc(a.titulo)}</b>${bd(a.tipo)}</div><p class="text-sm text-slate-600">${esc(a.descricao||'')}</p><p class="text-xs text-slate-500">Abre: ${esc(a.data_abertura||'—')} · Prazo: ${esc(a.prazo||'—')}</p>${al?sub(a):''}<div class="mt-2 flex gap-2">${al?btn('Submeter trabalho',()=>subForm(o,a)):''}${tut?btn('Ver entregas',()=>entregas(o,a),'btn2'):''}</div></section>`).join('')||'<p class="text-slate-500">Sem avaliações.</p>'));
}
function subForm(o,a){
  form('Submeter: '+esc(a.titulo),[['grupo','Nome do grupo (só trabalho de grupo)'],['texto','Resposta escrita (opcional)','textarea'],['ficheiro','Ficheiro (PDF, Word ou imagem)','file']],'submeterTrabalho',{avaliacao_id:a.id},()=>{toast('Trabalho enviado');(o.depois||avalCorpo)(o)},'Enviar');
}
async function entregas(o,a){
  const r=await api('listarSubmissoes',{avaliacao_id:a.id});
  if(r.erro)return toast(r.erro,1);
  info('Entregas — '+esc(a.titulo),
    ((r.entregas||[]).map(s=>`<div class="border rounded-lg p-2 text-sm"><b>${esc(s.aluno)}</b> ${bd(s.estado)}${s.grupo?` · Grupo: ${esc(s.grupo)}`:''}<div class="text-xs text-slate-500">${esc(s.submetido_em)}</div>${s.texto?`<p class="mt-1">${esc(s.texto)}</p>`:''}${s.ficheiro_url?`<a class="underline" style="color:var(--az)" target="_blank" rel="noopener" href="${esc(s.ficheiro_url)}">Abrir ficheiro</a>`:''}${s.nota!=null?`<p>Nota: <b>${esc(s.nota)}</b>${s.feedback?` · ${esc(s.feedback)}`:''}</p>`:''}<div class="mt-1">${btn(s.estado==='corrigida'?'Corrigir de novo':'Corrigir',()=>form('Corrigir — '+esc(s.aluno),[['nota','Nota (0-20)','number',0,s.nota],['feedback','Comentário','textarea',0,s.feedback]],'corrigirSubmissao',{submissao_id:s.id},()=>{toast('Correcção guardada');(o.depois||avalCorpo)(o)}),'btn2 !py-1')}</div></div>`).join('')||'<p class="text-slate-500">Ainda sem entregas.</p>')+
    ((r.nao_entregaram||[]).length?`<h3 class="font-semibold mt-3">Não entregaram</h3><p class="text-sm">${r.nao_entregaram.map(x=>esc(x.aluno)).join(', ')}</p>`:''));
}
V.avaliacoes=()=>porTD('Avaliações e entregas',avalCorpo);

/* ---------- Fóruns EAD: página detalhada em estrutura tipo LEMAS ---------- */
let FORUM_CTX=null;
function dataForum(s){if(!s)return '';const d=dtp(s);return isNaN(d)?String(s):`${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`}
function forumBreadcrumb(D,F){return `<nav class="text-sm mt-1 flex flex-wrap gap-1 items-center" style="color:#2563EB">${btn('Painel',()=>ir('painel'),'underline')} / ${btn('Minhas disciplinas',()=>abrirDisciplinaEad(D.id),'underline')} / ${btn(sigla(D.nome),()=>abrirDisciplinaEad(D.id),'underline')} / <span class="text-slate-500">${esc(F.titulo)}</span></nav>`}
async function forumCorpo(o){
  const tut=S.perfil==='professor_ead',r=await api('listarForuns',{turma_disciplina_id:o.id});
  if(r.erro)return pc(erroP(r));
  pc((tut?`<div class="mb-3">${btn('+ Novo fórum',()=>form('Novo fórum',[['topico_id','Tópico','select',[]],['ordem','Ordem','number'],['titulo','Título'],['descricao','Enunciado','textarea']],'criarForum',{turma_disciplina_id:o.id},()=>{toast('Fórum criado');forumCorpo(o)}))}</div>`:'')+
    ((r.dados||[]).map(f=>`<section class="bg-white border rounded-xl p-3 mb-2 flex flex-wrap items-center justify-between gap-2"><div><b>${esc(f.titulo)}</b> ${bd(f.estado)}<div class="text-sm text-slate-600">${esc(f.enunciado||f.descricao||'')} · ${f.mensagens} mensagens</div></div>${btn('Abrir',()=>abrirForumEad(f.id))}</section>`).join('')||vazio('Sem fóruns.')));
}
async function abrirForumEad(forum_id){
  ACTS=[];main(load);
  const r=await api('detalheForumEad',{forum_id:+forum_id});
  if(r.erro)return main(`<div class="mb-2">${btn('← Voltar à disciplina',()=>abrirDisciplinaEad(DETID),'btn2')}</div>${erroP(r)}`);
  api('registarAcessoDisciplina',{turma_disciplina_id:r.forum.turma_disciplina_id});
  FORUM_CTX=r;VISTA=()=>abrirForumEad(forum_id);renderForumPagina(r);
}
function renderForumPagina(r){
  const F=r.forum,D=r.disciplina,al=S.perfil==='aluno_ead',pr=S.perfil==='professor_ead';
  const concluida=!!(r.concluida||r.participou), nav=`<div class="flex flex-wrap justify-between gap-2 mt-4">${r.anterior?btn('← '+r.anterior.titulo,()=>abrirForumEad(r.anterior.id),'btn2'):''}${r.seguinte?btn(r.seguinte.titulo+' →',()=>abrirForumEad(r.seguinte.id),'btn2'):''}</div>`;
  const rows=r.topicos||[];
  const pesquisa=`<div class="flex items-center gap-2 mt-2"><input id="forumBusca" class="inp" placeholder="Pesquisar nos fóruns" aria-label="Pesquisar neste fórum"><span aria-hidden="true">⌕</span></div>`;
  const linhas=rows.map(t=>`<article class="forum-topic forum-row" data-search="${esc((t.titulo+' '+t.autor+' '+t.texto).toLowerCase())}" onclick="ACTS[${ACTS.push(()=>abrirTopicoForum(F.id,t.id))-1}]()"><div class="forum-topic-main"><div class="forum-topic-title"><span class="text-slate-400 text-xl mr-2">☆</span><b>${esc(t.titulo||'Participação')}</b></div><div class="forum-topic-count text-sm text-slate-600 mt-1">${t.numero_respostas||0} resposta(s)</div></div><div class="forum-topic-author">${esc(t.autor)}<br>${esc(dataForum(t.data_hora))}</div></article>`).join('');
  const criar=F.estado==='aberto'?btn('+ Criar novo tópico',()=>form('Criar novo tópico',[['titulo','Título do tópico'],['texto','Mensagem','textarea']],'publicarForum',{forum_id:F.id},()=>{toast('Tópico publicado');abrirForumEad(F.id)},'Publicar')):'<p class="text-sm text-slate-500">Este fórum está fechado.</p>';
  main(`<div class="w-full overflow-x-hidden" style="background:#F3F5F9">${ESC.logotipo?`<img src="${esc(ESC.logotipo)}" alt="" class="h-12 mb-2 object-contain">`:''}<h1 class="text-2xl font-bold break-words" style="color:#0B2A5B">${esc(D.nome)}</h1>${forumBreadcrumb(D,F)}
    <section class="bg-white border rounded-xl p-4 mt-4" style="border-color:#DDE3EE"><div class="text-sm text-slate-500">${r.topico?esc(r.topico.titulo):''}</div><div class="flex flex-wrap justify-between gap-2"><h2 class="text-xl font-bold" style="color:#0B2A5B">${esc(F.titulo)}</h2>${pr?btn('⚙ Opções',()=>info('Opções do fórum','Use os controlos de mensagens dentro de cada tópico.'),'btn2'):''}</div>${pesquisa}</section>
    <section class="bg-white border rounded-xl p-4 mt-3" style="border-color:#DDE3EE"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-lg font-bold" style="color:#0B2A5B">${esc(F.titulo)} ${al?(concluida?SELO_OK:btn('☐ Marcar como concluída',()=>marcarForum(F.id),'btn2 !py-1')):''}</h2></div><div class="whitespace-pre-wrap mt-3">${esc(r.enunciado||'')}</div></section>
    <div class="my-3">${criar}</div>${linhas?`<section class="forum-topic-list">${linhas}</section>`:`<section class="bg-white border rounded-xl p-4 text-slate-500">Ainda não há tópicos neste fórum. Seja o primeiro a criar.</section>`}${nav}</div>`);
  const b=$('#forumBusca');if(b)b.oninput=()=>document.querySelectorAll('.forum-row').forEach(x=>x.hidden=!x.dataset.search.includes(b.value.toLowerCase()));
}
async function marcarForum(id){const r=await api('marcarForumConcluido',{forum_id:id});if(r.erro)return toast(r.erro,1);FORUM_CTX.concluida=true;toast(r.ja_concluido?'Já estava concluído':'Fórum marcado como concluído');renderForumPagina(FORUM_CTX)}
async function abrirTopicoForum(forum_id,topico_id){
  const r=await api('mensagensForum',{forum_id:+forum_id});if(r.erro)return toast(r.erro,1);
  const F=FORUM_CTX&&FORUM_CTX.forum,pr=S.perfil==='professor_ead',msgs=r.dados||[],root=msgs.find(m=>+m.id===+topico_id),respostas=msgs.filter(m=>+m.id===+topico_id||+m.resposta_a===+topico_id);
  if(!root)return abrirForumEad(forum_id);
  const cards=respostas.map(m=>`<article class="bg-white border rounded-xl p-4 mb-2 ${m.estado==='oculta'?'opacity-50':''}" style="border-color:#DDE3EE"><div class="text-xs text-slate-500">${esc(m.autor)} • ${esc(dataForum(m.data_hora))}${m.resposta_a?' • Resposta a #'+m.resposta_a:''}</div><h3 class="font-bold mt-1" style="color:#0B2A5B">${esc(m.titulo||'Participação')}</h3><div class="whitespace-pre-wrap mt-2">${esc(m.texto)}</div>${pr&&m.estado!=='oculta'?`<div class="mt-2">${btn('Ocultar',async()=>{const mo=await pedir('Ocultar mensagem','Motivo');const x=await api('ocultarMensagemForum',{mensagem_id:m.id,motivo:mo});x.erro?toast(x.erro,1):abrirTopicoForum(forum_id,topico_id)},'btn2 !py-1')}</div>`:''}</article>`).join('');
  main(`${cabEad({disciplina:F?F.titulo:'Fórum'})}<div class="mb-3">${btn('← Voltar à lista de tópicos',()=>abrirForumEad(forum_id),'btn2')}</div><h2 class="text-xl font-bold mb-3" style="color:#0B2A5B">${esc(root.titulo||'Tópico')}</h2>${cards}<section class="bg-white border rounded-xl p-4 mt-3" style="border-color:#DDE3EE">${F&&F.estado==='aberto'?`<textarea id="forumResposta" class="inp" rows="3" maxlength="2000" placeholder="Escreva a sua mensagem"></textarea><div class="mt-2">${btn('Responder',async()=>{const texto=$('#forumResposta').value.trim();if(!texto)return toast('Escreva a mensagem',1);const x=await api('publicarForum',{forum_id:+forum_id,texto: texto,resposta_a:+topico_id,titulo:'Re: '+(root.titulo||'Participação')});x.erro?toast(x.erro,1):abrirTopicoForum(forum_id,topico_id)})}</div>`:'<p class="text-sm text-slate-500">Este fórum está fechado.</p>'}</section>`);
}
V.foruns=()=>porTD('Fóruns',forumCorpo);

/* ---------- Chat (EAD) ---------- */
async function chatCorpo(o){
  const tut=S.perfil==='professor_ead';
  const r=await api('listarChats',{turma_disciplina_id:o.id});
  if(r.erro)return pc(erroP(r));
  pc((tut?`<div class="mb-3">${btn('Novo chat',()=>form('Novo chat',[['titulo','Título']],'criarChat',{turma_disciplina_id:o.id},()=>{toast('Chat criado');chatCorpo(o)}))}</div>`:'')+
  ((r.dados||[]).map(c=>`<section class="bg-white border rounded-xl p-3 mb-2 flex items-center justify-between gap-2"><div><b>${esc(c.titulo)}</b> ${bd(c.estado)}</div>${btn('Abrir',()=>chatAbrir(o,c))}</section>`).join('')||'<p class="text-slate-500">Sem chats.</p>'));
}
let CHAT_TIMER=null,CHAT_STATE=null;
function pararPollingChat(){if(CHAT_TIMER){clearInterval(CHAT_TIMER);CHAT_TIMER=null}CHAT_STATE=null}
function chatMensagensHtml(L){return (L||[]).map(m=>`<div class="bg-white border rounded-lg p-2 text-sm"><span class="text-xs text-slate-500">${esc(m.autor)} · ${esc(m.data_hora)}</span><div>${esc(m.texto)}</div></div>`).join('')||'<p class="text-slate-500">Sem mensagens.</p>'}
function renderChat(o,c){const st=CHAT_STATE||{rows:[],last:0};pc(`<div class="chat-screen"><div class="mb-2 flex flex-wrap items-center gap-2"><b class="flex-1">${esc(c.titulo)}</b>${btn('Voltar',()=>{pararPollingChat();chatCorpo(o)},'btn2')}</div><div class="chat-grid"><div><div id="chatRows" class="space-y-1 mb-3 max-h-[55vh] overflow-auto">${chatMensagensHtml(st.rows)}</div></div><aside class="chat-participants bg-white border rounded-lg p-3"><b>Participantes</b><p class="text-sm text-slate-500 mt-2">Os participantes ativos aparecem no painel EAD.</p></aside></div>${c.estado==='aberto'?`<div class="chat-compose flex gap-2"><input id="ct" class="inp" maxlength="1000" placeholder="Escreva a sua mensagem" aria-label="Mensagem">${btn('Enviar',async()=>{const b=document.querySelector('.chat-compose button'),t=$('#ct').value.trim();if(!t)return toast('Escreva a mensagem primeiro',1);if(b)b.disabled=true;const x=await api('publicarChat',{chat_id:c.id,texto:t});if(x.erro)toast(x.erro,1);else{if($('#ct'))$('#ct').value='';await chatActualizar(o,c)}if(b)b.disabled=false},'btn')}</div>`:'<p class="text-sm text-slate-500">Este chat está fechado.</p>'}</div>`)}
async function chatActualizar(o,c){if(document.hidden)return;const r=await api('mensagensChat',{chat_id:c.id,desde_id:CHAT_STATE?CHAT_STATE.last:0});if(r.erro){toast(r.erro,1);return}const novas=r.dados||[];if(!CHAT_STATE)CHAT_STATE={rows:[],last:0};if(novas.length){CHAT_STATE.rows=CHAT_STATE.rows.concat(novas).slice(-50);CHAT_STATE.last=+CHAT_STATE.rows[CHAT_STATE.rows.length-1].id||CHAT_STATE.last;const box=$('#chatRows');if(box){box.innerHTML=chatMensagensHtml(CHAT_STATE.rows);box.scrollTop=box.scrollHeight}}}
async function chatAbrir(o,c){pararPollingChat();main(load);const r=await api('mensagensChat',{chat_id:c.id,desde_id:0});if(r.erro)return toast(r.erro,1);const rows=r.dados||[];CHAT_STATE={rows:rows.slice(-50),last:rows.length?+rows[rows.length-1].id:0};renderChat(o,c);CHAT_TIMER=setInterval(()=>{if(!document.hidden)chatActualizar(o,c)},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CHAT_STATE)chatActualizar(o,c)},{once:true})}

V.chats=()=>porTD('Chat',chatCorpo);

/* ======================================================================
   FASE 1 EAD — PAINEL DO ALUNO (modelo LEMAS). Só substitui V.painel para aluno_ead.
   ====================================================================== */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dtp=s=>new Date(String(s||'').replace(' ','T'));
const fdia=d=>`${DSEM[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
const fhora=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const chave=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sigla=n=>(String(n||'').split(/\s+/).filter(w=>w.length>2).map(w=>w[0]).join('').toUpperCase())||String(n||'').slice(0,4).toUpperCase();
const PB=[['recentes','Disciplinas acedidas recentemente'],['cronograma','Cronograma'],['ficheiros','Meus ficheiros privados'],['activos','Utilizadores ativos'],['disciplinas','Minhas disciplinas'],['medalhas','Medalhas recentes'],['calendario','Calendário'],['proximos','Próximos eventos'],['horario','Horário de hoje'],['avisos','Avisos recentes']];
let PAINEL=null,CALM=new Date(),CALD=null,CRONN=5,CRONF='todos',DISCORD='nome',DISCN=0;
const pbKey=()=>'pb_'+(S.username||S.nome||'aluno');
const pbLer=()=>{try{return JSON.parse(sessionStorage.getItem(pbKey())||'{}')}catch(e){return{}}};
const pbVis=k=>pbLer()[k]!==false;
const CB='style="border-color:#DDE3EE"';
const pbl=(k,t,h,ex='')=>pbVis(k)?`<section id="pb-${k}" class="bg-white border rounded-xl mb-3 overflow-hidden" ${CB}><div class="flex items-center justify-between gap-2 px-4 py-3 border-b" ${CB}><h2 class="font-semibold" style="color:#0B2A5B">${t}</h2><div class="flex items-center gap-2">${ex}</div></div><div class="p-4">${h}</div></section>`:'';
const vazio=t=>`<p class="text-sm text-slate-500">${t}</p>`;

async function painelAlunoEad(){
  ACTS=[];main(load);
  const r=await api('painelAlunoEad');
  if(r.erro)return main(erroP(r));
  PAINEL=r;CALM=new Date();CALD=null;pintarPainel();
  prefetchDisc();   // disciplinas abrem instantâneas
}

function pintarPainel(){
  ACTS=[];const r=PAINEL;
  const cab=`<div class="flex items-center justify-between gap-3 mb-3">${ESC.logotipo?`<img src="${esc(ESC.logotipo)}" alt="" class="h-14 max-w-[55%] object-contain">`:`<b style="color:#0B2A5B">${esc(ESC.nome)}</b>`}${btn('Personalizar esta página',pbConfig,'btn2 !px-3 !py-2 text-sm')}</div>
  <h1 class="text-xl font-bold" style="color:#0B2A5B">Olá, ${esc(S.nome)}</h1><p class="text-sm text-slate-600 mb-3">Turma: ${esc(r.turma||'—')} - ${esc(r.modalidade||'EAD')}</p>`;
  if(r.sem_matricula){main(`<div class="w-full overflow-x-hidden">${cab}${vazio('Ainda não tem matrícula activa. Contacte a secretaria.')}</div>`);return}
  main(`<div class="w-full overflow-x-hidden" style="background:#F3F5F9">${cab}
  ${pbl('recentes','Disciplinas acedidas recentemente',recentesHtml(),`<button type="button" class="btn2 !px-2 !py-1" aria-label="Anterior" onclick="document.getElementById('rc').scrollBy({left:-240,behavior:'smooth'})">‹</button><button type="button" class="btn2 !px-2 !py-1" aria-label="Seguinte" onclick="document.getElementById('rc').scrollBy({left:240,behavior:'smooth'})">›</button>`)}
  ${pbl('cronograma','Cronograma',`<div id="cronc">${cronHtml()}</div>`,`<span title="Calendário">📅</span><select id="cronf" class="inp !w-auto !py-1 text-sm" aria-label="Filtrar">${opts([['todos','Todos'],['avaliacao','Prazos'],['chat','Chats'],['calendario','Escola']])}</select>`)}
  ${pbl('ficheiros','Meus ficheiros privados',ficheirosHtml())}
  ${pbl('activos','Utilizadores ativos',activosHtml())}
  ${pbl('disciplinas','Minhas disciplinas',`<div id="pdisc">${discHtml()}</div>`,`<select id="discord" class="inp !w-auto !py-1 text-sm" aria-label="Ordenar">${opts([['nome','Nome da disciplina'],['prog','Progresso']])}</select><span class="text-sm text-slate-500">Lista</span>`)}
  ${pbl('medalhas','Medalhas recentes',(r.medalhas||[]).length?`<div class="flex flex-wrap gap-2">${r.medalhas.map(x=>`<span class="px-3 py-1.5 rounded-full text-sm" style="background:#FEF3C7;color:#92400E">🏅 ${esc(x.titulo)}</span>`).join('')}</div>`:vazio('Não tem medalhas para mostrar'))}
  ${pbl('calendario','Calendário',`<div id="calbox">${calHtml()}</div>`)}
  ${pbl('proximos','Próximos eventos',proximosHtml())}
  ${pbl('horario','Horário de hoje',(r.horario_hoje||[]).length?r.horario_hoje.map(h=>`<div class="py-1.5 border-t first:border-0 text-sm"><b style="color:#0B2A5B">${esc(String(h.hora_inicio).slice(0,5))}–${esc(String(h.hora_fim).slice(0,5))}</b> ${esc(h.disciplina)}${h.sala?` <span class="text-slate-500">· ${esc(h.sala)}</span>`:''}</div>`).join(''):vazio('Hoje não há aulas.'))}
  ${pbl('avisos','Avisos recentes',((r.avisos||[]).map(a=>`<div class="py-1.5 border-t first:border-0"><b style="color:#0B2A5B">${esc(a.titulo)}</b><div class="text-sm text-slate-600">${esc(a.mensagem)}</div></div>`).join('')||vazio('Sem avisos.'))+`<div class="mt-2 flex flex-wrap gap-3 text-sm">${btn('Ver todos os avisos',()=>ir('comunicados'),'underline')}${btn('Os meus documentos',()=>ir('documentos'),'underline')}</div>`)}
  </div>`);
  const cf=$('#cronf');if(cf){cf.value=CRONF;cf.onchange=()=>{CRONF=cf.value;const c=$('#cronc');if(c)c.innerHTML=cronHtml()}}

/* ---- Bloco 7: calendário mensal ---- */
function calHtml(){
  const y=CALM.getFullYear(),m=CALM.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),hoje=chave(new Date());
  const ev={};(PAINEL.calendario_mes||[]).forEach(e=>{const k=chave(dtp(e.data));(ev[k]=ev[k]||[]).push(e)});
  let c='';for(let i=0;i<off;i++)c+='<div></div>';
  for(let d=1;d<=nd;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),h=k===hoje,tem=!!ev[k];
    c+=`<button type="button" class="relative py-1.5 rounded text-sm ${h?'text-white font-bold':''} ${CALD===k?'ring-2':''}" style="${h?'background:#1F5FBF':'color:#0B2A5B'}" onclick="calDia('${k}')">${d}${tem?`<span class="absolute left-1/2 -translate-x-1/2 bottom-0.5 w-1.5 h-1.5 rounded-full" style="background:${h?'#fff':'#1F5FBF'}"></span>`:''}</button>`}
  const dia=CALD&&ev[CALD]?ev[CALD].map(e=>`<div class="text-sm py-1 border-t"><b style="color:#0B2A5B">${esc(e.titulo)}</b> <span class="text-slate-500">${e.com_hora?fhora(dtp(e.data)):''} ${esc(e.sub||'')}</span></div>`).join(''):(CALD?vazio('Sem eventos neste dia.'):'');
  return `<div class="flex items-center justify-between mb-2"><button type="button" class="btn2 !px-3 !py-1" aria-label="Mês anterior" onclick="calMover(-1)">«</button><b style="color:#0B2A5B">${MESES[m]} de ${y}</b><button type="button" class="btn2 !px-3 !py-1" aria-label="Mês seguinte" onclick="calMover(1)">»</button></div>
  <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-1">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1 text-center">${c}</div><div class="mt-2">${dia}</div>`;
}
function calMover(n){CALM=new Date(CALM.getFullYear(),CALM.getMonth()+n,1);CALD=null;$('#calbox').innerHTML=calHtml()}
function calDia(k){CALD=k;$('#calbox').innerHTML=calHtml()}

/* ======================================================================
   FASE 2 EAD — PÁGINA DA DISCIPLINA (modelo LEMAS). Aluno EAD e Professor EAD.
   Um único api('detalheDisciplinaEad') monta tudo; fórum e chat abrem as vistas existentes
   (as Fases 3 e 4 substituem por abrirForumEad / abrirChatEad).
   ====================================================================== */
let DET=null,DETID=null;
const rom=n=>{let s='';for(const[v,c]of[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=v){s+=c;n-=v}return s};
const fprazo=s=>{const d=dtp(s);return `${fdia(d)} às ${fhora(d)}`};
const TEM_NUM=/^\s*([IVXLC]+|\d+)\s*[-–.)]/i;
const dcard=(t,h)=>`<section class="bg-white border rounded-xl mb-3 overflow-hidden" ${CB}><h2 class="px-4 py-3 font-semibold border-b" style="color:#0B2A5B;border-color:#DDE3EE">${t}</h2><div class="p-4">${h}</div></section>`;
const oDet=()=>({id:DETID,depois:()=>abrirDisciplinaEad(DETID)});
const ehAl=()=>DET&&DET.papel==='aluno', ehPr=()=>DET&&DET.papel==='professor';
const SELO_OK='<span class="inline-block px-2 py-1 rounded text-sm text-white" style="background:#16A34A">✔ Concluída</span>';

function cabEad(D){
  return `<div class="mb-2">${ESC.logotipo?`<img src="${esc(ESC.logotipo)}" alt="" class="h-12 mb-2 object-contain">`:''}<h1 class="text-2xl font-bold break-words" style="color:#0B2A5B">${esc(D.disciplina)}</h1>
  <nav class="text-sm mt-1 bg-white border rounded-lg px-3 py-2" ${CB}>${btn('Painel',()=>ir('painel'),'underline')} / ${btn('Minhas disciplinas',()=>{ir('painel');setTimeout(()=>{const e=$('#pb-disciplinas');e&&e.scrollIntoView()},600)},'underline')} / <span class="text-slate-500">${esc(sigla(D.disciplina))}</span></nav></div>`;
}

/* ---- Abrir a disciplina (1 chamada) ou uma secção (materiais/avaliações/fóruns/chat/notas) ---- */
async function abrirDisciplinaEad(id,sec,extra){
  id=+id;
  if(sec&&sec!=='topo')return subVistaEad(id,sec,extra);
  ACTS=[];main(load);
  api('registarAcessoDisciplina',{turma_disciplina_id:id});
  const r=await api('detalheDisciplinaEad',{turma_disciplina_id:id});
  if(r.erro)return main(`<div class="mb-2">${btn('← Painel',()=>ir('painel'),'btn2')}</div>${erroP(r)}`);
  DET=r;DETID=id;VISTA=()=>abrirDisciplinaEad(id);
  pintarDisciplina();
}

async function subVistaEad(id,sec,extra){
  const D=(DET&&DETID===id&&DET.disciplina)||((PAINEL&&PAINEL.disciplinas_com_progresso)||[]).find(x=>x.id==id)||{id,disciplina:'Disciplina'};
  const o={id,depois:()=>subVistaEad(id,sec)};
  const T={mat:['Materiais de estudo',matCorpoEad],aval:['Avaliações e entregas',avalCorpo],foruns:['Fóruns',forumCorpo],chats:['Chat',chatCorpo],notas:['As minhas notas',x=>notasCorpoEad(x,D)]}[sec]||['Materiais de estudo',matCorpoEad];
  ACTS=[];VISTA=()=>subVistaEad(id,sec,extra);
  main(`${cabEad(D)}<div class="mb-3">${btn('← Voltar à disciplina',()=>abrirDisciplinaEad(id),'btn2')}</div><h2 class="font-semibold text-lg mb-2" style="color:#0B2A5B">${T[0]}</h2><div id="pc"></div>`);
  if(extra&&sec==='chats')return chatAbrir(o,extra);
  if(extra&&sec==='foruns')return abrirForumEad(extra.id||extra);
  await T[1](o);
}

/* ---- Tópico (e subtemas, recursivo) ---- */
function topicoHtml(t,i,sub){
  const tit=sub?`Subtema ${i+1}: ${esc(t.titulo)}`:(TEM_NUM.test(t.titulo)?esc(t.titulo):`${rom(i+1)} - ${esc(t.titulo)}`);
  const corpo=`<h3 class="${sub?'font-semibold':'text-lg font-semibold'} break-words" style="color:#0B2A5B">${tit}</h3>
  ${t.descricao?`<div class="text-sm whitespace-pre-wrap mt-1">${esc(t.descricao)}</div>`:''}
  ${t.data_fim?`<div class="text-xs text-slate-600 mt-1">Fim do prazo: ${esc(fprazo(t.data_fim))}</div>`:''}

  ${(t.subtemas||[]).map((s,j)=>topicoHtml(s,j,true)).join('')}`;
  return sub?`<div class="border-l-4 pl-3 mt-3" style="border-color:#DDE3EE">${corpo}</div>`:`<section class="bg-white border rounded-xl mb-3 p-4" ${CB}>${corpo}</section>`;

/* ---- Página completa ---- */
function estadoItemLabel(x){if(x.estado==='brevemente')return `<span class="item-status soon">brevemente</span>`;if(x.estado==='fechado')return `<span class="item-status closed">fechado</span>`;return `<span class="item-status open">aberto</span>`}
function itemIcon(tipo){return ({forum:'💬',chat:'💬',video:'▶️',material:'📄',trabalho:'📝',teste:'📝'})[tipo]||'•'}
function itemDescricao(x){if(x.estado==='brevemente')return `Abre em ${esc(x.abriu_em)}`;if(x.estado==='fechado')return 'Prazo terminado - Perdeu';return esc(x.descricao||'')}
function abrirItemDisciplina(x){
  if(x.estado==='brevemente')return toast('Esta actividade ainda não abriu',1);
  if(x.estado==='fechado')return toast('Prazo terminado',1);
  if(x.tipo==='forum')return abrirForumEad(x.referencia_id);
  if(x.tipo==='chat')return abrirChatEad(x.referencia_id);
  if(x.tipo==='material')return baixarMaterial(x.referencia_id);
  if(x.tipo==='trabalho'||x.tipo==='teste')return abrirAvaliacao(x.referencia_id);

codigo','Tipo','select',[['T1','Teste 1'],['T2','Teste 2'],['T3','Teste 3']]],['periodo_id','Período','select',P],['titulo','Título'],['descricao','Instruções','textarea'],['data_abertura','Abre em','datetime-local'],['prazo','Fecha em','datetime-local']],'criarAvaliacao',{turma_disciplina_id:DETID},()=>{toast('Teste criado');abrirDisciplinaEad(DETID)}))}</div>`);

function pintarDisciplina(){
  ACTS=[];const r=DET,D=r.disciplina,al=ehAl(),pr=ehPr(),pg=r.progresso||r.progresso_aluno||{pct:0},itens=r.itens_lista||[];
  const prog=al?`<div class="disc-progress"><div class="disc-progress-bar"><span style="width:${pg.pct||0}%"></span></div><b>${pg.pct||0}% concluída</b></div>`:'';
  const add=pr?`${btn('+ Adicionar actividade',adicionarAtividadeMenu,'btn2')}`:'';
  main(`<div class="disciplina-page">${cabEad(D)}${prog}<div class="actividades-head"><h2>Actividades</h2>${add}</div><div class="actividades-list">${itens.map(actividadeLinha).join('')||'<p class="text-sm text-slate-500 p-4">Ainda não existem actividades nesta disciplina.</p>'}</div></div>`);
}

/* ---------- Editar dados do aluno (Secretaria) ---------- */
async function editarAluno(id){
  const r=await api('obterAluno',{aluno_id:id});if(r.erro)return toast(r.erro,1);
  const a=r.aluno,e=(r.encarregados||[])[0]||{};
  const C=[['nome_completo','Nome completo','text',0,a.nome_completo],['data_nascimento','Data de nascimento','date',0,a.data_nascimento],['sexo','Sexo','select',[['M','Masculino'],['F','Feminino']],a.sexo],['naturalidade','Naturalidade','text',0,a.naturalidade],['bi_numero','Nº do BI','text',0,a.bi_numero],['morada','Morada','text',0,a.morada],['escola_origem','Escola de origem','text',0,a.escola_origem],['email','E-mail','email',0,a.email],['telefone','Telefone','tel',0,a.telefone]];
  const E=[['enc_nome','Encarregado: nome','text',0,e.nome],['enc_parentesco','Parentesco','text',0,e.parentesco],['enc_telefone','Telefone do encarregado','tel',0,e.telefone],['enc_profissao','Profissão do encarregado','text',0,e.profissao],['enc_morada','Morada do encarregado','text',0,e.morada]];
  modal('Editar aluno',C.concat(E).map(campo).join(''),async(b,er)=>{
    const d=await ler(b);
    if(!String(d.nome_completo||'').trim()){er('Indique o nome completo');return false}
    const x={aluno_id:id};C.forEach(c=>x[c[0]]=d[c[0]]);
    if(String(d.enc_nome||'').trim())x.encarregado={nome:d.enc_nome,parentesco:d.enc_parentesco,telefone:d.enc_telefone,profissao:d.enc_profissao,morada:d.enc_morada};
    const q=await api('actualizarAluno',x);
    if(q.erro){er(q.erro);return false}
    toast('Dados actualizados');rec();return true;
  });
}
